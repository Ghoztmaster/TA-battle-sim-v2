# TABS fork — static userscript, publiek (geen login).
# Exact match zodat het niet onder het /shockr/-blok (sessie-cookie) valt.
# Exact match wint altijd van prefix-blokken; volgorde in de server-block maakt niet uit.
location = /shockr/scripts/TA_Tiberium_Alliances_Battle_Simulator_V2.user.js {
    alias /opt/TA-battle-sim-v2/TA_Tiberium_Alliances_Battle_Simulator_V2.user.js;
    default_type text/javascript;
    charset utf-8;
    add_header Cache-Control "no-cache" always;
}
